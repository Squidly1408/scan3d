name: scan3d_native
description: Native AR depth capture (ARKit LiDAR mesh / ARCore depth) for Scan3D.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.scan3d_native
        pluginClass: Scan3dNativePlugin
      ios:
        pluginClass: Scan3dNativePlugin

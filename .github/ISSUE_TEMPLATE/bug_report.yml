name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. iPhone 15 Pro, iOS 18.1 / Pixel 8, Android 15
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Scan mode shown in the app
      options:
        - LiDAR
        - Depth
        - Features
        - Didn't get that far
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Output from `flutter run` or `flutter logs` helps a lot.
      render: text
